<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150">
  <style>
    /* Clear space is 25 units, per the identity. The mark inverts in a dark
       browser chrome so it never shows as a bright chip in the tab bar. */
    :root { --ground: #F6F4F1; --mark: #0B0B0C; }
    @media (prefers-color-scheme: dark) {
      :root { --ground: #0B0B0C; --mark: #F6F4F1; }
    }
  </style>
  <rect width="150" height="150" fill="var(--ground)"/>
  <path d="M0 0 H100 V100 H70 V24 L50 64 30 24 V100 H0 Z" fill="var(--mark)" transform="translate(25 25)"/>
</svg>
